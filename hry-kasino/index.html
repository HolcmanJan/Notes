<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Jackpot Tower</title>
  <meta name="theme-color" content="#0b2a1f">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Limelight&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <header id="top">
      <a href="../hry.html" class="back" aria-label="Zpět na hry">←</a>
      <div class="cur gold" title="Zlaťáky – trvalá vylepšení v dílně">🪙 <b id="c-gold">0</b></div>
      <div class="cur gem" title="Diamanty – talismany v herně">💎 <b id="c-gems">0</b></div>
      <div class="page-title" id="page-title">Stůl</div>
    </header>

    <main id="screen">
      <section id="page-battle" class="page">
        <div id="stage">
          <canvas id="cv"></canvas>
          <div id="hud">
            <div class="hud-l">
              <div class="wave">Vlna <b id="h-wave">1</b></div>
              <div class="wave-bar"><i id="h-wavebar"></i></div>
              <div class="table-name" id="h-table"></div>
            </div>
            <div class="hud-cash">$<b id="h-cash">0</b></div>
          </div>
          <div id="hud-btns">
            <button id="b-speed" data-act="speed">×1</button>
            <button id="b-pause" data-act="pause">❚❚</button>
            <button id="b-roulette" data-act="roulette" title="Ruleta">🎡</button>
            <button id="b-perk" data-act="perk" class="pulse" hidden>🃏</button>
          </div>
          <div id="start" hidden></div>
        </div>
        <div id="status">
          <div class="hp"><i id="h-hpbar"></i><span id="h-hp"></span></div>
          <div class="slot-line"><span id="h-slot">🎰 Automat se brzy zatočí</span><span class="slot-cd"><i id="h-slotcd"></i></span></div>
        </div>
        <div id="run-panel">
          <div class="tabs" id="run-tabs"></div>
          <div class="panel-tools">
            <button class="risk" id="b-risk" data-act="risk">🎲 Riskni: <b>vyp</b></button>
            <div class="bulk" id="run-bulk"></div>
          </div>
          <div class="grid" id="run-grid"></div>
        </div>
      </section>

      <section id="page-ws" class="page scroll" hidden></section>
      <section id="page-herna" class="page scroll" hidden></section>
      <section id="page-stats" class="page scroll" hidden></section>
    </main>

    <nav id="nav">
      <button data-page="battle" class="on"><span>🎰</span>Stůl</button>
      <button data-page="ws"><span>🛠️</span>Dílna</button>
      <button data-page="herna"><span>💎</span>Herna</button>
      <button data-page="stats"><span>🏆</span>Rekordy</button>
    </nav>
    <div id="modal-root"></div>
    <div id="toasts"></div>
  </div>
  <script src="js/logic.js"></script>
  <script src="js/render.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
