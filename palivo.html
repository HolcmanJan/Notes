<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palivo</title>
    <link rel="stylesheet" href="styles.css?v=041f9b53">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#c2410c">
    <link rel="apple-touch-icon" href="icon-192.png">
    <script src="app-guard.js?v=db886718"></script>
</head>
<body>
    <header>
        <div class="container header-inner">
            <h1>Palivo</h1>
        </div>
    </header>

    <main class="container">
        <section class="fuel-calc">
            <div class="fuel-trips">
                <button type="button" id="fuel-trips-btn" class="btn fuel-trips-btn">Šablony tras ▾</button>
                <div class="fuel-assign-menu hidden" id="fuel-trips-menu"></div>
            </div>
            <div class="fuel-input-row">
                <label for="fuel-km">Kilometry</label>
                <div class="fuel-input-wrap">
                    <input type="number" id="fuel-km" min="0" step="any" placeholder="0" inputmode="decimal">
                    <span class="fuel-unit">km</span>
                </div>
            </div>
            <div class="fuel-input-row">
                <label for="fuel-passengers">Cestující</label>
                <div class="fuel-input-wrap">
                    <input type="number" id="fuel-passengers" min="1" step="1" value="1" inputmode="numeric">
                    <span class="fuel-unit">os.</span>
                </div>
            </div>
            <div class="fuel-input-row">
                <label for="fuel-consumption">Spotřeba</label>
                <div class="fuel-input-wrap">
                    <input type="number" id="fuel-consumption" min="0" step="any" placeholder="7.0" inputmode="decimal">
                    <span class="fuel-unit">l/100km</span>
                </div>
            </div>
            <div class="fuel-input-row">
                <label for="fuel-price">Cena za litr</label>
                <div class="fuel-input-wrap">
                    <input type="number" id="fuel-price" min="0" step="any" placeholder="38" inputmode="decimal">
                    <span class="fuel-unit">Kč</span>
                </div>
            </div>

            <div class="fuel-result" id="fuel-result">
                <div class="fuel-result-row">
                    <span>Celkem</span>
                    <strong id="fuel-total">0 Kč</strong>
                </div>
                <div class="fuel-result-row fuel-result-highlight">
                    <span>Na osobu</span>
                    <strong id="fuel-per-person">0 Kč</strong>
                </div>
            </div>

            <div class="fuel-assign" id="fuel-assign">
                <button type="button" id="fuel-assign-btn" class="btn btn-primary fuel-assign-btn" disabled>
                    Přidat k osobě
                </button>
                <div class="fuel-assign-menu hidden" id="fuel-assign-menu"></div>
            </div>
        </section>

        <section class="fuel-people">
            <div class="fuel-people-header">
                <h2>Osoby</h2>
            </div>
            <div id="fuel-people-list"></div>
            <div class="fuel-new-person-row" id="fuel-new-person-row">
                <input type="text" id="fuel-new-person-name" class="fuel-new-person-input" placeholder="Jméno nové osoby…">
                <button type="button" id="fuel-new-person-btn" class="btn btn-primary fuel-new-person-submit">Přidat</button>
            </div>
        </section>
    </main>

    <script type="module" src="palivo.js?v=a9825c17"></script>
</body>
</html>
