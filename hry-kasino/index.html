<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Sloty &amp; Plenky</title>
  <meta name="theme-color" content="#1a0b24">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" class="carpet-carpetGreen diaper-diaperWhite">
    <header id="top">
      <a href="../hry.html" class="back" aria-label="Zpět na hry">←</a>
      <div class="cur chips" title="Žetony">🪙 <b id="c-chips">0</b></div>
      <div class="cur poop" title="Craptoměna">💩 <b id="c-poop">0</b></div>
      <div class="cur ram" id="cur-ram" title="RAM – permanentní měna" hidden>💾 <b id="c-ram">0</b></div>
    </header>

    <main id="screen">
      <section id="page-floor" class="page">
        <div id="marquee">
          <div class="title deco">Sloty <span>&amp;</span> Plenky</div>
          <div class="rate"><b id="h-rate">0</b> / s</div>
        </div>
        <div id="floor-bar">
          <button id="b-remodel" data-act="remodel" class="chip-btn">🔧 Přestavba</button>
          <button id="b-wake" data-act="wakeAll" class="chip-btn" hidden>⏰ Probudit <b id="h-sleep">0</b></button>
          <button id="b-boost" data-act="boost" class="chip-btn" hidden>⏩ Zrychlit</button>
          <button id="b-reboot" data-act="rebootSheet" class="chip-btn reboot" hidden>💾 Reboot</button>
        </div>
        <button id="allin" data-act="allInSheet" hidden>
          <span class="allin-glow"></span>
          <span class="deco">ALL IN</span>
          <small>Speciální automat se objevil…</small>
        </button>
        <div id="floor-wrap">
          <div id="floor"></div>
          <div id="fx"></div>
        </div>
        <div id="remodel-bar" hidden>
          <span id="remodel-text">Vyber automat, který chceš přesunout.</span>
          <button data-act="sellSel" id="b-sell" class="chip-btn danger" hidden>Prodat</button>
          <button data-act="remodel" class="chip-btn">Hotovo</button>
        </div>
        <p class="hint" id="floor-hint"></p>
      </section>
      <section id="page-machines" class="page" hidden></section>
      <section id="page-gamblers" class="page" hidden></section>
      <section id="page-crapto" class="page" hidden></section>
      <section id="page-tree" class="page" hidden></section>
      <section id="page-ach" class="page" hidden></section>
      <section id="page-more" class="page" hidden></section>
    </main>

    <nav id="nav">
      <button data-page="floor" class="on"><i>🎰</i><span>Podlaha</span></button>
      <button data-page="machines"><i>⚙️</i><span>Stroje</span></button>
      <button data-page="gamblers"><i>👶</i><span>Hráči</span></button>
      <button data-page="crapto"><i>💩</i><span>Crapto</span></button>
      <button data-page="tree"><i>💾</i><span>RAM</span></button>
      <button data-page="ach"><i>🏆</i><span>Úspěchy</span></button>
      <button data-page="more"><i>⋯</i><span>Více</span></button>
    </nav>

    <div id="sheet-root"></div>
    <div id="toasts"></div>
    <div id="ending" hidden></div>
  </div>
  <script type="module" src="js/ui.js"></script>
</body>
</html>
