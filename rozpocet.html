<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rozpočet</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container header-inner">
            <h1>Rozpočet</h1>
        </div>
    </header>

    <main class="container">
        <!-- Nastavení rozpočtu -->
        <section class="budget-header">
            <div class="budget-period-nav">
                <button type="button" id="period-prev" class="budget-nav-btn" aria-label="Předchozí období">‹</button>
                <div class="budget-period" id="budget-period"></div>
                <button type="button" id="period-next" class="budget-nav-btn" aria-label="Následující období">›</button>
            </div>
            <button type="button" id="period-today" class="budget-today-btn hidden">Aktuální období</button>
            <button type="button" id="new-month-btn" class="budget-newmonth-btn hidden">Nový měsíc</button>
            <div class="budget-input-row">
                <label for="budget-amount">Rozpočet na období:</label>
                <div class="budget-input-wrap">
                    <input type="number" id="budget-amount" min="0" step="100" placeholder="0">
                    <span class="budget-currency">Kč</span>
                </div>
            </div>
        </section>

        <!-- Záložky -->
        <div class="budget-tabs" role="tablist">
            <button type="button" class="budget-tab active" id="tab-actual" role="tab" aria-selected="true" aria-controls="panel-actual">Přehled</button>
            <button type="button" class="budget-tab" id="tab-predict" role="tab" aria-selected="false" aria-controls="panel-predict">Predikce</button>
        </div>

        <!-- Panel: Přehled -->
        <div id="panel-actual" role="tabpanel">
            <!-- Souhrn -->
            <section class="budget-summary" id="budget-summary">
                <div class="budget-stat">
                    <span class="budget-stat-label">Celkový rozpočet</span>
                    <span class="budget-stat-value" id="stat-total">0 Kč</span>
                </div>
                <div class="budget-stat">
                    <span class="budget-stat-label">Utraceno</span>
                    <span class="budget-stat-value" id="stat-spent">0 Kč</span>
                </div>
                <div class="budget-stat">
                    <span class="budget-stat-label">Zůstatek</span>
                    <span class="budget-stat-value" id="stat-remaining">
                        <span id="stat-remaining-value">0 Kč</span>
                        <span id="stat-remaining-arrow" class="budget-arrow hidden"></span>
                    </span>
                </div>
                <div class="budget-stat">
                    <span class="budget-stat-label">Denní budget</span>
                    <span class="budget-stat-value" id="stat-daily">0 Kč</span>
                </div>
            </section>

            <!-- Kalendář skutečnosti -->
            <section class="budget-calendar" id="budget-calendar"></section>
        </div>

        <!-- Panel: Predikce -->
        <div id="panel-predict" role="tabpanel" class="hidden">
            <!-- Souhrn predikce -->
            <section class="budget-summary" id="predict-summary">
                <div class="budget-stat">
                    <span class="budget-stat-label">Plánováno</span>
                    <span class="budget-stat-value" id="pred-stat-planned">0 Kč</span>
                </div>
                <div class="budget-stat">
                    <span class="budget-stat-label">Skutečnost</span>
                    <span class="budget-stat-value" id="pred-stat-actual">0 Kč</span>
                </div>
                <div class="budget-stat">
                    <span class="budget-stat-label">Odchylka</span>
                    <span class="budget-stat-value" id="pred-stat-diff">0 Kč</span>
                </div>
                <div class="budget-stat">
                    <span class="budget-stat-label">Zbývá naplánovat</span>
                    <span class="budget-stat-value" id="pred-stat-unplanned">0 Kč</span>
                </div>
            </section>

            <!-- Predikční kalendář -->
            <section class="budget-calendar" id="predict-calendar"></section>
        </div>
    </main>

    <script type="module" src="rozpocet.js"></script>
</body>
</html>
